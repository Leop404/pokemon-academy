<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Academy | Registro</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Link to the CSS file -->
    <link rel="stylesheet" href="../../css/styles.css">

</head>

<body class="body-registro">
    <header>
        <!-- NavBar de Bootstrap -->
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <a class="navbar-brand" href="../../index.html">PokeAcademy</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse nav" id="navbarNav">
                    <ul class="navbar-nav nav">
                        <li class="nav-item">
                            <a class="nav-link" href="../../index.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../quienes-somos.html">Quienes Somos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../programas.html">Nuestros Programas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link " href="../../index.html#caracteristicas">Características</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <div class="main-registro">
        <h2>Registro de Usuario</h2>
        <input class="form-control" type="text" name="nombres" id="nombres" placeholder="Ingresa tu Nombre">
        <input class="form-control" type="text" name="apellidos" id="apellidos" placeholder="Ingresa tu Apellido">
        <input class="form-control" type="email" name="email" id="email" placeholder="Ingresa tu Email">
        <input class="form-control" type="password" name="password" id="password" placeholder="Ingresa tu Contraseña">

        <p>Estoy de acuerdo con <a href="#">Terminos y Condiciones</a></p>
        <button class="btn btn-primary">Registrarse</button>
        <p><a href="#">¿Ya tengo cuenta?</a></p>
    </div>

    <!-- Whatsapp icon -->
    <div class="whatsapp">
        <img src="../../img/rotom-on-icon.png" alt="Chatea con nosotros por WhatsApp">
    </div>

    <!-- Segmento de footer -->
    <footer class="footer-light">
        <div class="img-footer">
            <img src="../../img/icon-facebook.png" alt="Síguenos en Facebook - Pokémon Academy VGC">
            <img src="../../img/icon-instagram.png" alt="Síguenos en Instagram - Pokémon Academy VGC">
            <img src="../../img/icon-linkedin.png" alt="Síguenos en LinkedIn - Pokémon Academy VGC">

        </div>
        <div class="container-footer">
            <p>© 2026 Pokémon Academy - Cursos VGC Online</p>
        </div>
    </footer>

    <!-- Bootstrap JC -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
